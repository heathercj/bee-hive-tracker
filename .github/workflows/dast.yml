name: "DAST (OWASP ZAP)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  zap_scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start the app in the background
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && echo "App is up" && break
            echo "Waiting for app to start... ($i)"
            sleep 1
          done

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false

      - name: Show app log (for debugging if the scan failed to reach the app)
        if: always()
        run: cat server.log || true
